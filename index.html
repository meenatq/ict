<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seating Chart MVP</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: white;
            color: black;
        }
        .seat {
            width: 100px;
            height: 100px;
            border: 2px solid navy;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .kid {
            background-color: lightgreen;
        }
        .adult {
            background-color: lightcoral;
        }
        .selected {
            border-color: green;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div class="container mx-auto mt-10">
        <h1 class="text-3xl mb-5 text-center">Seating Chart MVP</h1>
        <div class="grid grid-cols-8 gap-4">
            <!-- Generate 6 rows of seats -->
            <!-- 50% kids seats and 50% adults seats -->
            <script>
                const seats = [];
                const rows = 6;
                const cols = 8;
                const totalSeats = rows * cols;
                const kidSeats = totalSeats / 2;
                const adultSeats = totalSeats / 2;

                // Create seats based on predefined data
                for (let i = 0; i < totalSeats; i++) {
                    let type = i < kidSeats ? 'kid' : 'adult';
                    seats.push({
                        id: i + 1,
                        type: type,
                        price: type === 'kid' ? 10 : 15,
                        selected: false
                    });
                }

                seats.forEach(seat => {
                    document.write(`<div class='seat ${seat.type}' data-id='${seat.id}' data-price='${seat.price}'>${seat.id}</div>`);
                });

                // Seat selection logic
                document.querySelectorAll('.seat').forEach(seat => {
                    seat.addEventListener('click', function() {
                        seat.classList.toggle('selected');
                        seat.selected = !seat.selected;
                        console.log(`Seat ${seat.dataset.id} selected: ${seat.selected}`);
                    });
                });
            </script>
        </div>
        <div id="booking-summary" class="mt-5">
            <h2 class="text-2xl">Booking Summary</h2>
            <p id="total-price" class="mt-2"></p>
            <button class="mt-4 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" onclick="calculateTotal()">Calculate Total</button>
        </div>
    </div>
    <script>
        function calculateTotal() {
            let total = 0;
            document.querySelectorAll('.selected').forEach(seat => {
                total += parseFloat(seat.dataset.price);
            });
            document.getElementById('total-price').innerText = `Total Price: $${total}`;
        }
    </script>
</body>
</html>
