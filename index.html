<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seating Chart</title>
    <style>
        body {
            background-color: white;
            color: navy;
            font-family: Arial, sans-serif;
        }
        .kid-seat {
            background-color: skyblue;
        }
        .adult-seat {
            background-color: navy;
        }
        .selected-seat {
            background-color: white;
            border: 2px solid navy;
        }
        .seat {
            border: 1px solid navy;
            width: 50px;
            height: 50px;
            display: inline-block;
            margin: 5px;
            text-align: center;
            line-height: 50px;
        }
    </style>
</head>
<body>
    <h1>Seating Chart</h1>
    <div class="seating">
        <div class="seat kid-seat">K1</div>
        <div class="seat kid-seat">K2</div>
        <div class="seat adult-seat">A1</div>
        <div class="seat adult-seat">A2</div>
        <div class="seat selected-seat">S1</div>
    </div>
</body>
</html>
